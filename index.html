<script>
const ALL_CARDS = [{"id": "geo-1", "cat": "geo", "catLabel": "地理", "num": 1, "q": "地球上にある6つの大陸のうち、面積が最大で、アジアやヨーロッパの多くの国々が含まれている大陸。", "a": "ユーラシア大陸"}, {"id": "geo-2", "cat": "geo", "catLabel": "地理", "num": 2, "q": "赤道をはさんで日本のほぼ真南にあるオーストラリアや、太平洋の島々が属する州。", "a": "オセアニア州"}, {"id": "geo-3", "cat": "geo", "catLabel": "地理", "num": 3, "q": "アジアとヨーロッパにまたがる、世界で最も面積の大きい国。", "a": "ロシア連邦"}, {"id": "geo-4", "cat": "geo", "catLabel": "地理", "num": 4, "q": "西アジアや北アフリカ、東南アジアを中心に、多くの人々に信仰されている宗教。", "a": "イスラム教"}, {"id": "geo-5", "cat": "geo", "catLabel": "地理", "num": 5, "q": "乾燥地域で、牧草を得るため移動しながら行われている牧畜の呼び名。", "a": "遊牧"}, {"id": "geo-6", "cat": "geo", "catLabel": "地理", "num": 6, "q": "牛を神聖な動物として崇拝し、インドの約8割の人々が信仰する宗教。", "a": "ヒンドゥー教"}, {"id": "geo-7", "cat": "geo", "catLabel": "地理", "num": 7, "q": "寒帯の中で、こおった地面が短い夏の間だけとけて、わずかな植物が育つ地域。", "a": "ツンドラ"}, {"id": "geo-8", "cat": "geo", "catLabel": "地理", "num": 8, "q": "スウェーデンなど緯度の高い地域で見られる、夏至のころに一日中太陽が沈まない日々が続く現象。", "a": "白夜"}, {"id": "geo-9", "cat": "geo", "catLabel": "地理", "num": 9, "q": "世界で最も多くの人々に信仰され、「聖書」を教典とする宗教。", "a": "キリスト教"}, {"id": "geo-10", "cat": "geo", "catLabel": "地理", "num": 10, "q": "朝鮮半島でみられるこの民族独自の文字で、15世紀に考案されたもの。", "a": "ハングル"}, {"id": "geo-11", "cat": "geo", "catLabel": "地理", "num": 11, "q": "中国が近代化政策のもとで、外国企業が進出しやすい条件を整え、工業・商業・金融などの開発を進めている地区。", "a": "経済特区"}, {"id": "geo-12", "cat": "geo", "catLabel": "地理", "num": 12, "q": "中国で2015年までとられていた、一夫婦に子ども一人を奨励する政策。", "a": "一人っ子政策"}, {"id": "geo-13", "cat": "geo", "catLabel": "地理", "num": 13, "q": "1997年7月にイギリスから中国に返還された地域。", "a": "香港"}, {"id": "geo-14", "cat": "geo", "catLabel": "地理", "num": 14, "q": "韓国・台湾などのように、1970年代以降、発展途上国の中で急速な工業化と経済成長を遂げた国や地域。", "a": "NIES"}, {"id": "geo-15", "cat": "geo", "catLabel": "地理", "num": 15, "q": "東南アジアの米作にとって大切な雨をもたらす風。", "a": "季節風"}, {"id": "geo-16", "cat": "geo", "catLabel": "地理", "num": 16, "q": "東南アジアなどの国々で、主に商業や金融業などに従事している中国系の人々。", "a": "華人"}, {"id": "geo-17", "cat": "geo", "catLabel": "地理", "num": 17, "q": "主に欧米人が経営し、現地の安い労働力を使って、さとうきびやコーヒーなどの商品作物を栽培する大農園。", "a": "プランテーション"}, {"id": "geo-18", "cat": "geo", "catLabel": "地理", "num": 18, "q": "東南アジアの国々が加盟し、経済と政治の分野で協力を進めている組織。", "a": "ASEAN"}, {"id": "geo-19", "cat": "geo", "catLabel": "地理", "num": 19, "q": "アジアやアフリカ、南アメリカの熱帯で行われ、森林を焼きはらった土地で作物を栽培する農業。", "a": "焼畑農業"}, {"id": "geo-20", "cat": "geo", "catLabel": "地理", "num": 20, "q": "家畜の過放牧や過度の森林伐採によって、アフリカ大陸などで問題になっている環境問題。", "a": "砂漠化"}, {"id": "geo-21", "cat": "geo", "catLabel": "地理", "num": 21, "q": "さばく化がいちじるしく進行している、サハラ砂漠の南部に東西に広がる地域。", "a": "サヘル"}, {"id": "geo-22", "cat": "geo", "catLabel": "地理", "num": 22, "q": "1960年代以降の発展途上国で、人口が急増している現象。", "a": "人口爆発"}, {"id": "geo-23", "cat": "geo", "catLabel": "地理", "num": 23, "q": "乳牛を飼い、チーズやバターなどの乳製品を生産する農業。", "a": "酪農"}, {"id": "geo-24", "cat": "geo", "catLabel": "地理", "num": 24, "q": "北西ヨーロッパの気候に影響を与える、北大西洋海流の上を吹く風。", "a": "偏西風"}, {"id": "geo-25", "cat": "geo", "catLabel": "地理", "num": 25, "q": "スカンジナビア半島の海岸にみられる、氷河によってけずられた深い谷に海水が入り込んでできた入り江。", "a": "フィヨルド"}, {"id": "geo-26", "cat": "geo", "catLabel": "地理", "num": 26, "q": "1993年に発足し、政治的・経済的な統合を進めているヨーロッパの組織。", "a": "EU"}, {"id": "geo-27", "cat": "geo", "catLabel": "地理", "num": 27, "q": "ヨーロッパ北西部や東部でさかんな、穀物栽培と家畜の飼育を組み合わせた農業。", "a": "混合農業"}, {"id": "geo-28", "cat": "geo", "catLabel": "地理", "num": 28, "q": "EU加盟国の一部で、2002年から各国独自の通貨の流通を停止して使われている共通通貨。", "a": "ユーロ"}, {"id": "geo-29", "cat": "geo", "catLabel": "地理", "num": 29, "q": "スペイン・フランス・イタリアなどに居住する民族の大半の人々が信仰しているキリスト教の宗派。", "a": "カトリック"}, {"id": "geo-30", "cat": "geo", "catLabel": "地理", "num": 30, "q": "ロシア連邦東部の全域をさす地域。", "a": "シベリア"}, {"id": "geo-31", "cat": "geo", "catLabel": "地理", "num": 31, "q": "近年、アメリカ合衆国で増加している、メキシコなどから移住してきたスペイン語を話す人々。", "a": "ヒスパニック"}, {"id": "geo-32", "cat": "geo", "catLabel": "地理", "num": 32, "q": "世界各地に工場や支店を持ち、国境を越えて活動している企業。", "a": "多国籍企業"}, {"id": "geo-33", "cat": "geo", "catLabel": "地理", "num": 33, "q": "それぞれの地域の環境に適した農作物を栽培・生産すること。", "a": "適地適作"}, {"id": "geo-34", "cat": "geo", "catLabel": "地理", "num": 34, "q": "1970年代以降、テキサス州を中心に工業化が進んでいる、アメリカ合衆国の北緯37度以南の地域。", "a": "サンベルト"}, {"id": "geo-35", "cat": "geo", "catLabel": "地理", "num": 35, "q": "サンフランシスコの南にあり、IC（集積回路）などを生産する電子工業が発達している地域。", "a": "シリコンバレー"}, {"id": "geo-36", "cat": "geo", "catLabel": "地理", "num": 36, "q": "かつてインカ帝国が栄えていた、銅や銀などの鉱産資源が豊富な南アメリカの山脈。", "a": "アンデス山脈"}, {"id": "geo-37", "cat": "geo", "catLabel": "地理", "num": 37, "q": "世界の貴重な自然や伝統的な建造物・遺跡を破壊から守るための条約。", "a": "世界遺産条約"}, {"id": "geo-38", "cat": "geo", "catLabel": "地理", "num": 38, "q": "水鳥の生息地としての湿地を守るため、1971年にイランで採択され、日本も1980年に批准した条約。", "a": "ラムサール条約"}, {"id": "geo-39", "cat": "geo", "catLabel": "地理", "num": 39, "q": "アンデス山脈やロッキー山脈、日本列島などを含む造山帯。", "a": "環太平洋造山帯"}, {"id": "geo-40", "cat": "geo", "catLabel": "地理", "num": 40, "q": "日本海を流れる暖流。", "a": "対馬海流"}, {"id": "geo-41", "cat": "geo", "catLabel": "地理", "num": 41, "q": "高知県沖の太平洋岸を北上する暖流。", "a": "黒潮"}, {"id": "geo-42", "cat": "geo", "catLabel": "地理", "num": 42, "q": "千島列島から北海道や東北地方の太平洋沖を南下してくる海流。", "a": "親潮"}, {"id": "geo-43", "cat": "geo", "catLabel": "地理", "num": 43, "q": "地図上、日本を東と西に分ける境目で、本州の中央部を南北に走る帯状の地域。", "a": "フォッサマグナ"}, {"id": "geo-44", "cat": "geo", "catLabel": "地理", "num": 44, "q": "千葉県と茨城県の境を流れる、日本最大の流域面積をもつ河川。", "a": "利根川"}, {"id": "geo-45", "cat": "geo", "catLabel": "地理", "num": 45, "q": "川が山地から出たところに、川によって運ばれた土砂や小石がたい積してできた傾斜地。", "a": "扇状地"}, {"id": "geo-46", "cat": "geo", "catLabel": "地理", "num": 46, "q": "細かい土砂のたい積した土地からなり、海にも比較的近いところにある、きわめて平らな土地。", "a": "三角州"}, {"id": "geo-47", "cat": "geo", "catLabel": "地理", "num": 47, "q": "若狭湾沿岸や志摩半島のように、岬と入り江が入りくんだ海岸地形。", "a": "リアス海岸"}, {"id": "geo-48", "cat": "geo", "catLabel": "地理", "num": 48, "q": "水深200mくらいまでの傾斜のゆるやかな海底地形。", "a": "大陸棚"}, {"id": "geo-49", "cat": "geo", "catLabel": "地理", "num": 49, "q": "沿岸国が水産資源や鉱産資源を利用することが国際的に認められている、領海の外側200海里までの海域。", "a": "排他的経済水域"}, {"id": "geo-50", "cat": "geo", "catLabel": "地理", "num": 50, "q": "東北地方の一部と北海道地方、南西諸島を除いた日本の大部分が含まれる気候帯。", "a": "温帯"}, {"id": "geo-51", "cat": "geo", "catLabel": "地理", "num": 51, "q": "総人口に占める15歳未満の子どもの割合が低くなり、65歳以上の高齢者の割合が高くなる現象。", "a": "少子高齢化"}, {"id": "geo-52", "cat": "geo", "catLabel": "地理", "num": 52, "q": "阿蘇山や十和田湖で見られる、火山の中央部が落ちこむなどしてできた地形。", "a": "カルデラ"}, {"id": "geo-53", "cat": "geo", "catLabel": "地理", "num": 53, "q": "鹿児島県や宮崎県に分布する、火山噴出物が積もってできた台地。", "a": "シラス台地"}, {"id": "geo-54", "cat": "geo", "catLabel": "地理", "num": 54, "q": "稚魚や稚貝などを育成して放流し、それを育ててから捕獲する漁業。", "a": "栽培漁業"}, {"id": "geo-55", "cat": "geo", "catLabel": "地理", "num": 55, "q": "高知県などで行われている、温暖な気候を利用して出荷時期を早める野菜の栽培。", "a": "促成栽培"}, {"id": "geo-56", "cat": "geo", "catLabel": "地理", "num": 56, "q": "中国山地周辺の町村などで見られる、人口の減少が続き、社会生活に支障がでる現象。", "a": "過疎"}, {"id": "geo-57", "cat": "geo", "catLabel": "地理", "num": 57, "q": "海水の汚染が深刻になった瀬戸内海で、養殖魚などが死ぬ被害を引き起こす、プランクトンの異常発生。", "a": "赤潮"}, {"id": "geo-58", "cat": "geo", "catLabel": "地理", "num": 58, "q": "工業用水として地下水を大量にくみ上げたことにより起こる公害。", "a": "地盤沈下"}, {"id": "geo-59", "cat": "geo", "catLabel": "地理", "num": 59, "q": "中央高地の飛騨山脈・木曽山脈・赤石山脈をまとめた呼び名。", "a": "日本アルプス"}, {"id": "geo-60", "cat": "geo", "catLabel": "地理", "num": 60, "q": "東京・川崎・横浜を中心とする工業地帯。", "a": "京浜工業地帯"}, {"id": "geo-61", "cat": "geo", "catLabel": "地理", "num": 61, "q": "大都市の人口が減少し、その都市の郊外や隣接する県の人口が増加する現象。", "a": "ドーナツ化現象"}, {"id": "geo-62", "cat": "geo", "catLabel": "地理", "num": 62, "q": "大消費地に近いことを生かして、都市の人々が消費する新鮮な野菜や花などを生産する農業。", "a": "近郊農業"}, {"id": "geo-63", "cat": "geo", "catLabel": "地理", "num": 63, "q": "東北地方や北海道の太平洋側に冷害を起こす、夏の冷たい北東風。", "a": "やませ"}, {"id": "geo-64", "cat": "geo", "catLabel": "地理", "num": 64, "q": "「大館曲げわっぱ」「南部鉄器」「会津塗り」のように、地域特有の材料や技術を生かした工芸品を生産する工業。", "a": "伝統工業"}, {"id": "geo-65", "cat": "geo", "catLabel": "地理", "num": 65, "q": "高度経済成長期に重化学工業が発達し、その工場が帯のようにのびた、北九州から関東までの地域。", "a": "太平洋ベルト"}, {"id": "geo-66", "cat": "geo", "catLabel": "地理", "num": 66, "q": "わが国でとられてきた、原材料を輸入して製品を輸出する貿易の型。", "a": "加工貿易"}, {"id": "geo-67", "cat": "geo", "catLabel": "地理", "num": 67, "q": "二酸化炭素などの増加が原因とされ、海面の上昇や異常気象を引き起こすおそれのある地球規模の環境問題。", "a": "地球温暖化"}, {"id": "geo-68", "cat": "geo", "catLabel": "地理", "num": 68, "q": "工場や自動車などから出る窒素酸化物や硫黄酸化物が大気中で水分と結びついてでき、森林などに被害を出す雨。", "a": "酸性雨"}, {"id": "hist-1", "cat": "hist", "catLabel": "歴史", "num": 1, "q": "ナイル川流域に発達した古代文明。太陽暦がつくられ、測量技術も発達していた。", "a": "エジプト文明"}, {"id": "hist-2", "cat": "hist", "catLabel": "歴史", "num": 2, "q": "古代中国の黄河流域で占いに使用され、漢字のもとになったとされる文字。", "a": "甲骨文字"}, {"id": "hist-3", "cat": "hist", "catLabel": "歴史", "num": 3, "q": "古代インドで、仏教を開いた人物。", "a": "シャカ"}, {"id": "hist-4", "cat": "hist", "catLabel": "歴史", "num": 4, "q": "中国の春秋・戦国時代に儒教の教えを初めて説いた人物。", "a": "孔子"}, {"id": "hist-5", "cat": "hist", "catLabel": "歴史", "num": 5, "q": "東西交流の交通路の中で、唐の時代に重要な役割を果たした陸路。", "a": "シルクロード"}, {"id": "hist-6", "cat": "hist", "catLabel": "歴史", "num": 6, "q": "大陸から稲作が伝わったころ使用された、うすくてかざりの少ない実用向きの土器。", "a": "弥生土器"}, {"id": "hist-7", "cat": "hist", "catLabel": "歴史", "num": 7, "q": "3世紀ごろ、中国の魏に使いを送った邪馬台国の女王。", "a": "卑弥呼"}, {"id": "hist-8", "cat": "hist", "catLabel": "歴史", "num": 8, "q": "古墳のまわりや頂上におかれていた、円筒形や人物・家などをかたどった土製品。", "a": "埴輪"}, {"id": "hist-9", "cat": "hist", "catLabel": "歴史", "num": 9, "q": "前方後円墳がつくられた時代に、大陸から日本に移り住み、土器づくり・土木・建築・織物などの技術を伝えた人々。", "a": "渡来人"}, {"id": "hist-10", "cat": "hist", "catLabel": "歴史", "num": 10, "q": "6世紀に、仏像や経典を日本に伝えた朝鮮半島の国。", "a": "百済"}, {"id": "hist-11", "cat": "hist", "catLabel": "歴史", "num": 11, "q": "5〜6世紀ごろ大陸から伝来し、仏教とともに日本人の考え方などに大きな影響を与えた教え。", "a": "儒教"}, {"id": "hist-12", "cat": "hist", "catLabel": "歴史", "num": 12, "q": "聖徳太子が定めた制度で、才能や手柄に応じて家柄にとらわれず、役人を取り立てるしくみ。", "a": "冠位十二階"}, {"id": "hist-13", "cat": "hist", "catLabel": "歴史", "num": 13, "q": "聖徳太子が定めたきまりで、仏教や儒教の考え方を取り入れ、役人の心がまえを示したもの。", "a": "十七条の憲法"}, {"id": "hist-14", "cat": "hist", "catLabel": "歴史", "num": 14, "q": "7世紀の初め、中国につかわされた小野妹子らの使節。", "a": "遣隋使"}, {"id": "hist-15", "cat": "hist", "catLabel": "歴史", "num": 15, "q": "聖徳太子が建てたとされる寺で、現存する最古の木造建築。", "a": "法隆寺"}, {"id": "hist-16", "cat": "hist", "catLabel": "歴史", "num": 16, "q": "公地・公民の方針がうち出された、中大兄皇子らによる政治の改革。", "a": "大化の改新"}, {"id": "hist-17", "cat": "hist", "catLabel": "歴史", "num": 17, "q": "天智天皇の没後、天皇の位をめぐっておこった争い。天武天皇はこの争いに勝って即位した。", "a": "壬申の乱"}, {"id": "hist-18", "cat": "hist", "catLabel": "歴史", "num": 18, "q": "律令の制度による戸籍にもとづいて、6歳以上のすべての男女に口分田を与えることなどを定めた法。", "a": "班田収授法"}, {"id": "hist-19", "cat": "hist", "catLabel": "歴史", "num": 19, "q": "701年、唐の法律にならってつくられた日本の法典。", "a": "大宝律令"}, {"id": "hist-20", "cat": "hist", "catLabel": "歴史", "num": 20, "q": "律令制において、北九州の守りについた人々。", "a": "防人"}, {"id": "hist-21", "cat": "hist", "catLabel": "歴史", "num": 21, "q": "律令制において、6歳以上の人々に支給された田。", "a": "口分田"}, {"id": "hist-22", "cat": "hist", "catLabel": "歴史", "num": 22, "q": "8世紀のはじめ、唐の長安を手本としてつくられた都。", "a": "平城京"}, {"id": "hist-23", "cat": "hist", "catLabel": "歴史", "num": 23, "q": "朝廷が口分田の不足をおぎなうため、新しく開墾した土地の永久私有を認めた法律。", "a": "墾田永年私財法"}, {"id": "hist-24", "cat": "hist", "catLabel": "歴史", "num": 24, "q": "奈良時代、口分田の面積に応じて納めさせた税。", "a": "租"}, {"id": "hist-25", "cat": "hist", "catLabel": "歴史", "num": 25, "q": "国ごとに国分寺を、都には東大寺を建てた天皇。", "a": "聖武天皇"}, {"id": "hist-26", "cat": "hist", "catLabel": "歴史", "num": 26, "q": "聖武天皇のころを中心に栄えた文化。", "a": "天平文化"}, {"id": "hist-27", "cat": "hist", "catLabel": "歴史", "num": 27, "q": "インドや西アジアなどから伝わった宝物がおさめられた、東大寺にある建物。", "a": "正倉院"}, {"id": "hist-28", "cat": "hist", "catLabel": "歴史", "num": 28, "q": "奈良時代に何度も遭難し、盲目になりながらも日本に渡ってきた中国の僧。", "a": "鑑真"}, {"id": "hist-29", "cat": "hist", "catLabel": "歴史", "num": 29, "q": "7世紀から10世紀にかけて朝鮮半島を統一していた国。", "a": "新羅"}, {"id": "hist-30", "cat": "hist", "catLabel": "歴史", "num": 30, "q": "荘園の不輸租権などが出されてから広がり始めた私有地。", "a": "荘園"}, {"id": "hist-31", "cat": "hist", "catLabel": "歴史", "num": 31, "q": "平安時代の初めに唐に渡って仏教を学び、帰国後、高野山に金剛峯寺を建て、真言宗を広めた人物。", "a": "空海"}, {"id": "hist-32", "cat": "hist", "catLabel": "歴史", "num": 32, "q": "空海が仏教を学んだころの中国の王朝名。", "a": "唐"}, {"id": "hist-33", "cat": "hist", "catLabel": "歴史", "num": 33, "q": "日本の風土や生活に合った文化が最も栄えたころ、藤原氏の一族によって行われていた政治。", "a": "摂関政治"}, {"id": "hist-34", "cat": "hist", "catLabel": "歴史", "num": 34, "q": "かな文字の普及により、貴族の生活や感情をこまやかに描いた紫式部の長編小説。", "a": "源氏物語"}, {"id": "hist-35", "cat": "hist", "catLabel": "歴史", "num": 35, "q": "平安時代の後半、岩手県平泉町の中尊寺金色堂を建てるなど、東北地方で勢力をほこっていた一族。", "a": "藤原氏"}, {"id": "hist-36", "cat": "hist", "catLabel": "歴史", "num": 36, "q": "11世紀に始まった、上皇による政治。", "a": "院政"}, {"id": "hist-37", "cat": "hist", "catLabel": "歴史", "num": 37, "q": "1167年、武士の出身として初めて太政大臣になった人物。", "a": "平清盛"}, {"id": "hist-38", "cat": "hist", "catLabel": "歴史", "num": 38, "q": "領地をなかだちとして、主従の間が御恩と奉公の関係で成り立った制度。", "a": "封建制度"}, {"id": "hist-39", "cat": "hist", "catLabel": "歴史", "num": 39, "q": "鎌倉時代、将軍との間で御恩と奉公の主従関係で結ばれた武士。", "a": "御家人"}, {"id": "hist-40", "cat": "hist", "catLabel": "歴史", "num": 40, "q": "鎌倉幕府を開いた源頼朝の死後、実権を握った北条氏がついた実質的な幕府の最高役職。", "a": "執権"}, {"id": "hist-41", "cat": "hist", "catLabel": "歴史", "num": 41, "q": "鎌倉時代、幕府の支配する土地や荘園で、土地の管理や年貢の取り立てにあたった役職。", "a": "地頭"}, {"id": "hist-42", "cat": "hist", "catLabel": "歴史", "num": 42, "q": "1221年におこった承久の乱の後、鎌倉幕府が朝廷の監視と西国の武士を支配するために京都に設置した役所。", "a": "六波羅探題"}, {"id": "hist-43", "cat": "hist", "catLabel": "歴史", "num": 43, "q": "承久の乱の後、執権北条泰時が武家社会の慣習や裁判の例などをもとにして定めた法律。", "a": "御成敗式目"}, {"id": "hist-44", "cat": "hist", "catLabel": "歴史", "num": 44, "q": "1274年と1281年の2度にわたって元が攻めてきたときの幕府の執権。", "a": "北条時宗"}, {"id": "hist-45", "cat": "hist", "catLabel": "歴史", "num": 45, "q": "元寇のときの元の皇帝。", "a": "フビライ・ハン"}, {"id": "hist-46", "cat": "hist", "catLabel": "歴史", "num": 46, "q": "13世紀に中国の元にやってきたイタリア人で、日本を「黄金の島」としてヨーロッパに紹介した人物。", "a": "マルコ・ポーロ"}, {"id": "hist-47", "cat": "hist", "catLabel": "歴史", "num": 47, "q": "後醍醐天皇が行った公家重視の政治。", "a": "建武の新政"}, {"id": "hist-48", "cat": "hist", "catLabel": "歴史", "num": 48, "q": "密貿易と区別するため勘合（合い札）をもって行われたことから名付けられた日明貿易。", "a": "勘合貿易"}, {"id": "hist-49", "cat": "hist", "catLabel": "歴史", "num": 49, "q": "南朝と北朝を統一した室町幕府の3代将軍。", "a": "足利義満"}, {"id": "hist-50", "cat": "hist", "catLabel": "歴史", "num": 50, "q": "室町幕府で将軍を補佐する役職。", "a": "管領"}, {"id": "hist-51", "cat": "hist", "catLabel": "歴史", "num": 51, "q": "慈照寺銀閣に見られる、今日の和風住宅のもとになった建築様式。", "a": "書院造"}, {"id": "hist-52", "cat": "hist", "catLabel": "歴史", "num": 52, "q": "細川氏と山名氏の対立に、将軍のあとつぎ問題が加わっておこった、11年にも及ぶ戦乱。", "a": "応仁の乱"}, {"id": "hist-53", "cat": "hist", "catLabel": "歴史", "num": 53, "q": "戦国大名が、領国の武士や農民の統制をはかるためにつくった独自のきまり。", "a": "分国法"}, {"id": "hist-54", "cat": "hist", "catLabel": "歴史", "num": 54, "q": "応仁の乱から復興に取り組むなど、京都の自治において中心的な役割をはたした有力な商工業者たち。", "a": "町衆"}, {"id": "hist-55", "cat": "hist", "catLabel": "歴史", "num": 55, "q": "応仁の乱の後に広まった、下の者が上の者を実力で倒す風潮。", "a": "下剋上"}, {"id": "hist-56", "cat": "hist", "catLabel": "歴史", "num": 56, "q": "鎌倉時代や室町時代に、各地の港で年貢の水上輸送や保管などをしていた運送業者。", "a": "問丸"}, {"id": "hist-57", "cat": "hist", "catLabel": "歴史", "num": 57, "q": "団結を固めた農民が、年貢をめぐって荘園領主などに交渉や抵抗をしたり、借金の帳消しを求めたりしたこと。", "a": "土一揆"}, {"id": "hist-58", "cat": "hist", "catLabel": "歴史", "num": 58, "q": "用水の管理や山林の利用などについて、村独自のおきてをつくるなど、室町時代の農民の自治的な結びつき。", "a": "惣"}, {"id": "hist-59", "cat": "hist", "catLabel": "歴史", "num": 59, "q": "惣において、村のことを相談したり、村のきまりを定めるために、神社などで開いた会議。", "a": "寄合"}, {"id": "hist-60", "cat": "hist", "catLabel": "歴史", "num": 60, "q": "15世紀に尚氏が統一して成立し、日本・中国・朝鮮・東南アジア各地を結ぶ中継貿易で栄えた王国。", "a": "琉球王国"}, {"id": "hist-61", "cat": "hist", "catLabel": "歴史", "num": 61, "q": "ヨーロッパから大西洋を渡り、西インド諸島を発見したイタリア人。", "a": "コロンブス"}, {"id": "hist-62", "cat": "hist", "catLabel": "歴史", "num": 62, "q": "インド航路を発見したポルトガル人。", "a": "バスコ・ダ・ガマ"}, {"id": "hist-63", "cat": "hist", "catLabel": "歴史", "num": 63, "q": "わが国にキリスト教を伝えたイエズス会の宣教師。", "a": "ザビエル"}, {"id": "hist-64", "cat": "hist", "catLabel": "歴史", "num": 64, "q": "ルターなどが中心になった、ヨーロッパでの宗教活動。", "a": "宗教改革"}, {"id": "hist-65", "cat": "hist", "catLabel": "歴史", "num": 65, "q": "南蛮人が日本にキリスト教を伝えた時代に、海外布教を積極的に行ったカトリック教会の組織。", "a": "イエズス会"}, {"id": "hist-66", "cat": "hist", "catLabel": "歴史", "num": 66, "q": "ポルトガル人によって日本に伝えられた鉄砲を、長篠の戦いで集団戦法に用いた尾張出身の戦国大名。", "a": "織田信長"}, {"id": "hist-67", "cat": "hist", "catLabel": "歴史", "num": 67, "q": "織田信長が、城下の市場の税を免除し、座の特権を廃止して商工業の発展をはかった政策。", "a": "楽市・楽座"}, {"id": "hist-68", "cat": "hist", "catLabel": "歴史", "num": 68, "q": "織田信長のあとを受けて国内を統一し、わが国における封建社会を確立した人物。", "a": "豊臣秀吉"}, {"id": "hist-69", "cat": "hist", "catLabel": "歴史", "num": 69, "q": "豊臣秀吉が、農民などから武器を取り上げた政策。", "a": "刀狩"}, {"id": "hist-70", "cat": "hist", "catLabel": "歴史", "num": 70, "q": "豊臣秀吉が行った、全国の田畑の広さや土地のよしあしを調べ、収穫高を石高で表した政策。", "a": "太閤検地"}, {"id": "hist-71", "cat": "hist", "catLabel": "歴史", "num": 71, "q": "豊臣秀吉の政権を握ったころの文化。", "a": "桃山文化"}, {"id": "hist-72", "cat": "hist", "catLabel": "歴史", "num": 72, "q": "茶の湯の作法を定め、わび茶を大成させた人物。", "a": "千利休"}, {"id": "hist-73", "cat": "hist", "catLabel": "歴史", "num": 73, "q": "江戸幕府成立のきっかけとなった、1600年におきた戦い。", "a": "関ヶ原の戦い"}, {"id": "hist-74", "cat": "hist", "catLabel": "歴史", "num": 74, "q": "関ヶ原の戦いの前後に徳川氏にしたがった大名で、幕藩体制成立後、遠隔地に配置された大名。", "a": "外様大名"}, {"id": "hist-75", "cat": "hist", "catLabel": "歴史", "num": 75, "q": "徳川家康は、大名や商人に許可状をあたえて海外への渡航を許した。この許可状を持つ船。", "a": "朱印船"}, {"id": "hist-76", "cat": "hist", "catLabel": "歴史", "num": 76, "q": "江戸幕府が、大名を統制し、幕府の支配を強化するために定めた法律。", "a": "武家諸法度"}, {"id": "hist-77", "cat": "hist", "catLabel": "歴史", "num": 77, "q": "日本人の海外への行き来を禁止し、外国との貿易を幕府が独占した外交政策。", "a": "鎖国"}, {"id": "hist-78", "cat": "hist", "catLabel": "歴史", "num": 78, "q": "鎖国のときも、幕府との貿易が許されたヨーロッパの国。", "a": "オランダ"}, {"id": "hist-79", "cat": "hist", "catLabel": "歴史", "num": 79, "q": "鎖国のころ、オランダ人により提出された、海外の情報が記された報告書。", "a": "オランダ風説書"}, {"id": "hist-80", "cat": "hist", "catLabel": "歴史", "num": 80, "q": "3代将軍徳川家光のときに定められた制度で、大名は1年おきに領地と江戸に住むことを定められた。", "a": "参勤交代"}, {"id": "hist-81", "cat": "hist", "catLabel": "歴史", "num": 81, "q": "1637年に九州地方で起きた、きびしい年貢とキリスト教徒への迫害に対する一揆。", "a": "島原・天草一揆"}, {"id": "hist-82", "cat": "hist", "catLabel": "歴史", "num": 82, "q": "江戸時代、農民に年貢や犯罪について共同責任を負わせるためにつくられたしくみ。", "a": "五人組"}, {"id": "hist-83", "cat": "hist", "catLabel": "歴史", "num": 83, "q": "17世紀後半、蝦夷地で、松前藩に対抗して戦ったアイヌの指導者。", "a": "シャクシャイン"}, {"id": "hist-84", "cat": "hist", "catLabel": "歴史", "num": 84, "q": "江戸時代、各街道に設置された、旅人の通行手形や荷物などを調べる監視所。", "a": "関所"}, {"id": "hist-85", "cat": "hist", "catLabel": "歴史", "num": 85, "q": "18世紀前半、目安箱を設けて広く人々の意見を求め、新田の開発など幕府財政の立て直しをはかった将軍。", "a": "徳川吉宗"}, {"id": "hist-86", "cat": "hist", "catLabel": "歴史", "num": 86, "q": "徳川吉宗が行った幕府政治の改革。", "a": "享保の改革"}, {"id": "hist-87", "cat": "hist", "catLabel": "歴史", "num": 87, "q": "享保の改革で定められた、公平な支配をめざして裁判の基準を示した法律。", "a": "公事方御定書"}, {"id": "hist-88", "cat": "hist", "catLabel": "歴史", "num": 88, "q": "18世紀後半、株仲間を奨励して税収の増加をはかり、長崎貿易を奨励した幕府の老中。", "a": "田沼意次"}, {"id": "hist-89", "cat": "hist", "catLabel": "歴史", "num": 89, "q": "1792年、ラクスマンが根室に来航したころ、松平定信が幕府の政治を立て直すために行った改革。", "a": "寛政の改革"}, {"id": "hist-90", "cat": "hist", "catLabel": "歴史", "num": 90, "q": "19世紀の初め、日本地図をつくるために、日本全国を実測した人物。", "a": "伊能忠敬"}, {"id": "hist-91", "cat": "hist", "catLabel": "歴史", "num": 91, "q": "1837年、大阪で乱をおこした、もと大坂町奉行所の役人。", "a": "大塩平八郎"}, {"id": "hist-92", "cat": "hist", "catLabel": "歴史", "num": 92, "q": "19世紀の半ば、老中水野忠邦が行った改革で、きびしい倹約をすすめ、株仲間を解散させた。", "a": "天保の改革"}, {"id": "hist-93", "cat": "hist", "catLabel": "歴史", "num": 93, "q": "江戸時代に、幕府や藩に税を納めることで営業の独占を許され、大きな利益をあげていた商工業者の同業者組合。", "a": "株仲間"}, {"id": "hist-94", "cat": "hist", "catLabel": "歴史", "num": 94, "q": "年貢米や特産物を運んで貨幣にするために、大阪などに設けられた建物。", "a": "蔵屋敷"}, {"id": "hist-95", "cat": "hist", "catLabel": "歴史", "num": 95, "q": "江戸時代の後半、綿織物や絹織物などを生産するため、人々を一つの作業場に集め、分業によって行った生産方法。", "a": "工場制手工業"}, {"id": "hist-96", "cat": "hist", "catLabel": "歴史", "num": 96, "q": "17世紀後半から18世紀初めにかけて、上方の商業の発達を背景とした町人を中心に栄えた文化。", "a": "元禄文化"}, {"id": "hist-97", "cat": "hist", "catLabel": "歴史", "num": 97, "q": "元禄文化で、『日本永代蔵』などの浮世草子で町人の生き方をありのままに描いた人物。", "a": "井原西鶴"}, {"id": "hist-98", "cat": "hist", "catLabel": "歴史", "num": 98, "q": "17世紀後半に、松尾芭蕉が書いた紀行文で、東北・北陸をまわる旅を記した作品。", "a": "おくのほそ道"}, {"id": "hist-99", "cat": "hist", "catLabel": "歴史", "num": 99, "q": "江戸時代、各地にできた庶民の子の教育機関。", "a": "寺子屋"}, {"id": "hist-100", "cat": "hist", "catLabel": "歴史", "num": 100, "q": "蘭学医の杉田玄白らが翻訳した西洋医学の翻訳書。", "a": "解体新書"}, {"id": "hist-101", "cat": "hist", "catLabel": const STORAGE_KEY='social_flashcards_v2';
const state={category:'all',weakOnly:false,weakIds:[],learnedIds:[],order:[],index:0,showAnswer:false};
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s)Object.assign(state,s);}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function baseCards(){if(state.category==='geo')return ALL_CARDS.filter(c=>c.cat==='geo');if(state.category==='hist')return ALL_CARDS.filter(c=>c.cat==='hist');return ALL_CARDS.slice();}
function visibleCards(){let base=baseCards();if(state.weakOnly){const weak=new Set(state.weakIds);base=base.filter(c=>weak.has(c.id));}const baseIds=new Set(base.map(c=>c.id));let ids=(Array.isArray(state.order)?state.order:[]).filter(id=>baseIds.has(id));const missing=base.map(c=>c.id).filter(id=>!ids.includes(id));ids=ids.concat(missing);return ids.map(id=>base.find(c=>c.id===id)).filter(Boolean);}
function ensureOrder(){const v=visibleCards();state.order=v.map(c=>c.id);if(state.index>=v.length)state.index=0;if(state.index<0)state.index=0;}
function currentCard(){const v=visibleCards();return v.length?(v[state.index]||v[0]):null;}
function uniquePush(arr,v){if(!arr.includes(v))arr.push(v);}
function removeValue(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);}
function nextCard(){const t=visibleCards().length;if(!t)return;state.index=(state.index+1)%t;state.showAnswer=false;save();render();}
function prevCard(){const t=visibleCards().length;if(!t)return;state.index=(state.index-1+t)%t;state.showAnswer=false;save();render();}
function markWeak(){const c=currentCard();if(!c)return;uniquePush(state.weakIds,c.id);removeValue(state.learnedIds,c.id);nextCard();}
function markLearned(){const c=currentCard();if(!c)return;uniquePush(state.learnedIds,c.id);removeValue(state.weakIds,c.id);nextCard();}
function toggleAnswer(){state.showAnswer=!state.showAnswer;save();render();}
function shuffleCurrent(){const ids=visibleCards().map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}state.order=ids;state.index=0;state.showAnswer=false;save();render();}
function resetCurrentOrder(){let base=baseCards();if(state.weakOnly){const weak=new Set(state.weakIds);base=base.filter(c=>weak.has(c.id));}state.order=base.map(c=>c.id);state.index=0;state.showAnswer=false;save();render();}
function clearWeak(){if(!confirm('『覚えていない』の記録を消しますか？'))return;state.weakIds=[];if(state.weakOnly)state.index=0;save();render();}
function clearAll(){if(!confirm('覚えた・覚えていない・順番など、すべての記録をリセットしますか？'))return;state.category='all';state.weakOnly=false;state.weakIds=[];state.learnedIds=[];state.order=ALL_CARDS.map(c=>c.id);state.index=0;state.showAnswer=false;save();render();}
function modeText(){const cat=state.category==='all'?'全部':state.category==='geo'?'地理':'歴史';return state.weakOnly?`モード：${cat} / 覚えていないだけ`:`モード：${cat}`;}
function render(){ensureOrder();const visible=visibleCards();const card=currentCard();document.getElementById('category').value=state.category;const weakBtn=document.getElementById('toggleWeak');weakBtn.textContent=`覚えていないだけ：${state.weakOnly?'ON':'OFF'}`;weakBtn.classList.toggle('active',state.weakOnly);document.getElementById('progress').textContent=visible.length?`${state.index+1} / ${visible.length}`:'0 / 0';document.getElementById('weakCount').textContent=`覚えていない ${state.weakIds.length}`;document.getElementById('learnedCount').textContent=`覚えた ${state.learnedIds.length}`;document.getElementById('modeText').textContent=modeText();const main=document.getElementById('mainArea');if(!card){main.innerHTML=`<div class="empty"><div style="font-size:1.05rem;font-weight:700;margin-bottom:8px;">表示する問題がありません</div><div>「覚えていないだけ」がONのときは、先に問題を『覚えていない』に入れてください。</div></div>`;return;}const isWeak=state.weakIds.includes(card.id);const isLearned=state.learnedIds.includes(card.id);main.innerHTML=`<div class="card" id="cardBox"><div><div class="tag">${card.catLabel} ${String(card.num).padStart(card.cat==='hist'?3:2,'0')}</div><div class="label">${state.showAnswer?'答え':'問題'}</div><div class="text ${state.showAnswer?'answer':''}">${state.showAnswer?card.a:card.q}</div><div class="hint">カードをタッチすると${state.showAnswer?'問題':'答え'}が出ます</div></div><div><div class="statusbar" style="margin:0 0 6px;"><div class="chip">${isWeak?'要復習':isLearned?'覚えた':'未判定'}</div></div></div></div><div class="actions"><button class="danger" id="weakBtn">覚えていない</button><button class="success" id="learnedBtn">覚えた</button></div><div class="nav"><button id="prevBtn">← 前へ</button><button id="flipBtn">答えを見る</button><button id="nextBtn">次へ →</button><button id="removeWeakBtn">要復習から外す</button></div>`;document.getElementById('cardBox').addEventListener('click',toggleAnswer);document.getElementById('flipBtn').addEventListener('click',toggleAnswer);document.getElementById('prevBtn').addEventListener('click',prevCard);document.getElementById('nextBtn').addEventListener('click',nextCard);document.getElementById('weakBtn').addEventListener('click',markWeak);document.getElementById('learnedBtn').addEventListener('click',markLearned);document.getElementById('removeWeakBtn').addEventListener('click',()=>{removeValue(state.weakIds,card.id);save();render();});}
document.getElementById('category').addEventListener('change',e=>{state.category=e.target.value;state.index=0;state.showAnswer=false;state.order=visibleCards().map(c=>c.id);save();render();});document.getElementById('toggleWeak').addEventListener('click',()=>{state.weakOnly=!state.weakOnly;state.index=0;state.showAnswer=false;state.order=visibleCards().map(c=>c.id);save();render();});document.getElementById('shuffle').addEventListener('click',shuffleCurrent);document.getElementById('resetOrder').addEventListener('click',resetCurrentOrder);document.getElementById('clearWeak').addEventListener('click',clearWeak);document.getElementById('clearAll').addEventListener('click',clearAll);load();if(!Array.isArray(state.order)||!state.order.length)state.order=ALL_CARDS.map(c=>c.id);render();
</script></body></html>
